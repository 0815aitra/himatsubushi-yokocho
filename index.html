<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8e7" />
  <title>ひまつぶし横丁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <div class="paper-noise"></div>
  <header class="topbar">
    <button class="brand" data-home aria-label="ホームへ戻る">
      <span class="brand-mark">暇</span>
      <span><b>ひまつぶし横丁</b><small>ちょっと遊んで、すぐ戻れる。</small></span>
    </button>
    <div class="top-actions">
      <div class="total-score"><span>きょうの記録</span><strong id="playedCount">0</strong><small>回あそんだ</small></div>
      <button class="sound-btn" id="soundBtn" aria-label="効果音を切り替える">♪</button>
    </div>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="hero">
        <div>
          <p class="eyebrow">8 GAMES, NO WAITING</p>
          <h1>退屈なんて、<br><em>30秒</em>で吹き飛ばせ。</h1>
          <p class="hero-copy">考える、覚える、狙う。気分に合わせて選べる、手のひらサイズのゲームセンター。</p>
        </div>
        <div class="hero-stamp"><span>全</span><strong>8</strong><span>種</span></div>
      </div>
      <div class="filter-row" id="filters">
        <button class="filter active" data-filter="all">ぜんぶ</button>
        <button class="filter" data-filter="brain">じっくり</button>
        <button class="filter" data-filter="speed">すばやく</button>
        <button class="filter" data-filter="classic">定番</button>
      </div>
      <div class="game-grid" id="gameGrid"></div>
    </section>

    <section id="gameView" class="view">
      <button class="back-btn" data-home>← ゲーム一覧へ</button>
      <div class="game-shell">
        <div class="game-heading">
          <div><p id="gameKicker" class="eyebrow"></p><h2 id="gameTitle"></h2><p id="gameDescription"></p></div>
          <div class="heading-tools">
            <label class="difficulty-label">難易度<select id="difficultySelect"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option></select></label>
            <button class="rank-btn" id="rankBtn">🏆 ランキング</button>
            <div class="best-box"><span>BEST</span><strong id="bestScore">—</strong></div>
          </div>
        </div>
        <div id="gameArea" class="game-area"></div>
      </div>
    </section>
  </main>
  <dialog id="rankDialog" class="rank-dialog"><div class="rank-head"><div><p class="eyebrow">LOCAL RANKING</p><h3 id="rankTitle">ランキング</h3></div><button id="rankClose" aria-label="閉じる">×</button></div><p class="rank-note">この端末に保存された記録です</p><div class="rank-tabs"><button data-rank-diff="easy">やさしい</button><button data-rank-diff="normal" class="active">ふつう</button><button data-rank-diff="hard">むずかしい</button></div><ol id="rankList"></ol></dialog>
  <footer><span>ひまつぶし横丁</span><p>記録はこのブラウザに保存されます。</p></footer>
  <script src="app.js"></script>
</body>
</html>
